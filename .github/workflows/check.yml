name: Check

# The commit gate from AGENTS.md on both platforms, for pushes to main, PRs
# and manual runs. macOS code paths (libproc, rusage-only figures) are only
# exercised here, so a unit touching them needs a green run before review.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust components
        run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      # D40: every committed trace passes the checker. cargo test runs it
      # too (tests/bench_tools.rs); this step names it in the CI log.
      - run: bench/check-trace

  # Both platforms: the D16 execve test (bin/muzzle keeps the group
  # leader) is only proved on macOS here.
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Check npm versions match Cargo.toml
        run: node scripts/npm-version.js --check "v$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
      # The pi extension's tests drive the real binary (MUZZLE_BIN defaults
      # to target/debug/muzzle). Node 24 runs the .ts files directly.
      - run: cargo build --locked
      - name: pi extension tests
        run: npm test --prefix npm/muzzle
      - name: npm pack (wrapper, extension, skill)
        run: npm pack --dry-run ./npm/muzzle
